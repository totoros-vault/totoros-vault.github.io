<!DOCTYPE html>
<html>
<head>
  <title>Totoro's Vault</title>
  <style>
    body {
      background-color: #192338;
      color: #E6ECF5;
      font-family: Georgia, serif;
      text-align: center;
    }

    .card {
      background-color: #26344E;
      border: 1px solid #8FA3C8;
      padding: 20px;
      border-radius: 25px;
      width: 200px;
      margin: 20px auto;
    }

    .card img {
      width: 100%;
      border-radius: 15px;
      margin-bottom: 12px;
    }

    .card a {
      display: inline-block;
      background-color: #8FA3C8;
      color: #192338;
      padding: 8px 16px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
    }

    .card a:hover {
      background-color: #E6ECF5;
    }
  </style>
</head>
<body>
  <h1>*。°☆ Totoro's Vault ☆°。*</h1>
  <div class="card">
    <p>Favourite Movie</p>
    <img src="https://pinimg.com" alt="Yuta">
    <br>
    <a href="https://google.com" target="_blank">Click to watch</a>
  </div>
</body>
</html>
